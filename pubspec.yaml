name: saia_skills
description: Skill catalog for SAIA agents. Bilingual markdown skills with a read API and no inference engine attached.
version: 0.2.0
homepage: https://github.com/Open-Neom/saia_skills
repository: https://github.com/Open-Neom/saia_skills
issue_tracker: https://github.com/Open-Neom/saia_skills/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

# Paquete de contenido declarativo para agentes SAIA: sin dependencias pesadas de inferencia.
# Consumible por cualquier aplicación o agente Flutter de forma liviana y desacoplada.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

